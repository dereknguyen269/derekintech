<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap');
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 1200px; height: 630px; }
    body {
      color: #f8fafc;
      background: #0b1020;
      font-family: Inter, system-ui, sans-serif;
      overflow: hidden;
    }
    .canvas {
      position: relative;
      width: 1200px;
      height: 630px;
      padding: 64px 76px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      background:
        radial-gradient(650px 320px at 76% 18%, rgba(96,165,250,.18), transparent 68%),
        radial-gradient(520px 280px at 8% 96%, rgba(37,99,235,.12), transparent 70%),
        #0b1020;
    }
    .grid { position: absolute; inset: 0; opacity: .22; background-image: linear-gradient(rgba(96,165,250,.14) 1px, transparent 1px), linear-gradient(90deg, rgba(96,165,250,.14) 1px, transparent 1px); background-size: 42px 42px; mask-image: linear-gradient(to bottom, black, transparent 78%); }
    .orb { position: absolute; width: 380px; height: 380px; right: -88px; top: -82px; border: 1px solid rgba(96,165,250,.18); border-radius: 50%; box-shadow: 0 0 0 28px rgba(96,165,250,.035), 0 0 0 56px rgba(96,165,250,.025); }
    .brand { position: relative; display: flex; align-items: center; gap: 14px; color: #f8fafc; font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 24px; font-weight: 700; letter-spacing: -.04em; }
    .mark { width: 34px; height: 34px; display: grid; place-items: center; color: #06111f; background: #60a5fa; border-radius: 9px; font-size: 18px; box-shadow: 0 0 22px rgba(96,165,250,.45); }
    .content { position: relative; max-width: 800px; }
    .eyebrow { margin-bottom: 22px; color: #60a5fa; font: 700 16px/1.2 'JetBrains Mono', monospace; letter-spacing: .12em; text-transform: uppercase; }
    h1 { margin: 0; max-width: 850px; font-size: 64px; line-height: 1.02; letter-spacing: -.055em; font-weight: 800; }
    .accent { color: #60a5fa; }
    .subtitle { margin: 26px 0 0; color: #cbd5e1; font-size: 23px; line-height: 1.45; max-width: 720px; }
    .footer { position: relative; display: flex; justify-content: space-between; align-items: center; color: #8ea0b8; font: 500 15px 'JetBrains Mono', monospace; }
    .status { display: flex; align-items: center; gap: 10px; }
    .dot { width: 9px; height: 9px; border-radius: 50%; background: #22c55e; box-shadow: 0 0 12px #22c55e; }
    .url { color: #60a5fa; }
  </style>
</head>
<body>
  <main class="canvas">
    <div class="grid"></div><div class="orb"></div>
    <div class="brand"><span class="mark">&gt;_</span><span>derekin.tech</span></div>
    <section class="content">
      <div class="eyebrow">Full-stack engineer · AI systems builder</div>
      <h1>Building useful<br /><span class="accent">software systems.</span></h1>
      <p class="subtitle">Open-source projects, developer tools, and agentic workflows by Derek Nguyen.</p>
    </section>
    <footer class="footer"><span class="status"><i class="dot"></i> Available for interesting problems</span><span class="url">Ho Chi Minh City · Vietnam</span></footer>
  </main>
</body>
</html>
